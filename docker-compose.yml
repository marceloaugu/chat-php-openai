version: '3.8'

services:
  chat-app:
    build: .
    container_name: chat-app
    ports:
      - "8080:80"
    environment:
      - DB_HOST=db
      - DB_NAME=chat_app
      - DB_USER=chat_user
      - DB_PASS=chat_password
      - OPENAI_BASE_URL=http://host.docker.internal:8081/v1
      - OPENAI_API_KEY=
    depends_on:
      - db
    restart: always

  db:
    image: mariadb:10.11
    container_name: chat-db
    ports:
      - "3306:3306"
    environment:
      - MYSQL_DATABASE=chat_app
      - MYSQL_USER=chat_user
      - MYSQL_PASSWORD=chat_password
      - MYSQL_ROOT_PASSWORD=root_password
    volumes:
      - db-data:/var/lib/mysql
    restart: always

volumes:
  db-data:
